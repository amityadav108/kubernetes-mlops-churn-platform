apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-mlops-api
  labels:
    app: churn-mlops-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: churn-mlops-api
  template:
    metadata:
      labels:
        app: churn-mlops-api
    spec:
      containers:
        - name: churn-mlops-api
          image: churn-mlops-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
