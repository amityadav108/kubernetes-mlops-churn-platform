
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Prepare offline Docker dependencies
        run: |
          python -m pip download \
            --only-binary=:all: \
            --dest wheelhouse \
            -r requirements.txt

      - name: Build Docker image
        run: docker build -t churn-mlops-api:ci .
